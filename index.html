<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitality Planner Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuration setup
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vitality-planner-standalone';
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const MEAL_OPTIONS = [
            "Select Meal",
            "Steel-cut Oats with Dates",
            "Buckwheat Porridge",
            "Mediterranean Avocado Toast",
            "Performance Kitchari",
            "Mediterranean Quinoa Bowl",
            "Walnut-Basil Lentil Pasta",
            "Vegetable & Shrimp Paella",
            "Salmon with Roasted Beets",
            "Ground Turkey & Sweet Potato",
            "Chicken Thigh Tagine",
            "Red Lentil Dal",
            "Golden Milk Smoothie"
        ];

        const App = () => {
            const [user, setUser] = useState(null);
            const [meals, setMeals] = useState([]);
            const [loading, setLoading] = useState(true);
            const [syncing, setSyncing] = useState(false);

            const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
            const slots = ["Breakfast", "Lunch", "Dinner"];

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (err) {
                        console.error("Auth error:", err);
                    }
                };
                initAuth();
                return auth.onAuthStateChanged(u => {
                    setUser(u);
                    if (!u) setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;

                const planDoc = db.doc(`artifacts/${appId}/users/${user.uid}/plans/current`);
                
                const unsubscribe = planDoc.onSnapshot((doc) => {
                    if (doc.exists) {
                        setMeals(doc.data().grid);
                    } else {
                        const initialGrid = days.map(day => ({
                            day,
                            Breakfast: "Select Meal",
                            Lunch: "Select Meal",
                            Dinner: "Select Meal"
                        }));
                        setMeals(initialGrid);
                    }
                    setLoading(false);
                }, (error) => {
                    console.error("Firestore error:", error);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [user]);

            const updateMeal = async (dayIdx, slot, value) => {
                const newMeals = [...meals];
                newMeals[dayIdx][slot] = value;
                setMeals(newMeals);

                if (!user) return;
                setSyncing(true);
                try {
                    await db.doc(`artifacts/${appId}/users/${user.uid}/plans/current`).set({
                        grid: newMeals,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (err) {
                    console.error("Cloud save failed:", err);
                } finally {
                    setTimeout(() => setSyncing(false), 800);
                }
            };

            if (loading) return (
                <div className="flex h-screen items-center justify-center bg-white">
                    <div className="flex flex-col items-center gap-4">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                        <p className="text-slate-500 font-medium">Initialising Vitality Cloud...</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 pb-24">
                    <nav className="bg-white border-b px-4 py-4 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-xl text-white">
                                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                    </svg>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-slate-800 leading-tight">Vitality Planner</h1>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Ayurvedic Standalone</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                {syncing ? (
                                    <span className="text-[10px] font-bold text-indigo-500 animate-pulse">SYNCING...</span>
                                ) : (
                                    <span className="text-[10px] font-bold text-emerald-500">SAVED TO CLOUD</span>
                                )}
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-4 md:p-6 animate-fade-in">
                        <div className="grid gap-4">
                            {meals.map((dayData, dIdx) => (
                                <div key={dayData.day} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="bg-slate-50 px-6 py-2 border-b border-slate-100 flex justify-between items-center">
                                        <span className="font-bold text-slate-700">{dayData.day}</span>
                                    </div>
                                    <div className="p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {slots.map(slot => (
                                            <div key={slot} className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-tight">{slot}</label>
                                                <select 
                                                    value={dayData[slot]}
                                                    onChange={(e) => updateMeal(dIdx, slot, e.target.value)}
                                                    className="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg text-sm p-2 outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                                                >
                                                    {MEAL_OPTIONS.map(opt => (
                                                        <option key={opt} value={opt}>{opt}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    <footer className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-sm border-t p-3 text-center">
                        <p className="text-[9px] text-slate-400 font-mono uppercase">
                            Standalone Cloud Version • User: {user?.uid?.substring(0,8)}...
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
